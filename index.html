<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleach commerce</title>
    <link rel="stylesheet" href="bootstrap-5.3.8/dist/css/bootstrap.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="bootstrap-5.3.8/dist/js/bootstrap.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo.png" alt="Logo" class="d-inline-block align-text-top logo">
                Bleach
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Articles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Qui sommes-nous ?</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Inscription</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <main>
        <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel" style="max-height: 500px; overflow: hidden;">
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="10000">
                    <img src="img/1.webp" class="d-block w-100" alt="Bleach carousel image 1" style="object-fit: cover; height: 500px;">
                </div>
                <div class="carousel-item" data-bs-interval="2000">
                    <img src="img/2.jpg" class="d-block w-100" alt="Bleach carousel image 2" style="object-fit: cover; height: 500px;">
                </div>
                <div class="carousel-item">
                    <img src="img/3.webp" class="d-block w-100" alt="Bleach carousel image 3" style="object-fit: cover; height: 500px;">
                </div>
            </div>
            
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </main>
</body>

</html>
